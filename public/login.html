<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Mantenimiento</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <h2>Iniciar Sesión</h2>
            <p>Sistema de Gestión de Mantenimiento</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Correo Electrónico</label>
                    <input type="email" id="usuario" name="usuario" required placeholder="correo@ejemplo.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="********">
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

            <div id="mensajeError" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <!-- Script de autenticación asíncrona -->
    <script src="/js/login.js"></script>
</body>
</html>
