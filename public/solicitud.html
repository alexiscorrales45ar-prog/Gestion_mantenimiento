<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Solicitud de Mantenimiento - Mantenimiento</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="container">
    <h2>Caso de Uso 2: Registrar Solicitud de Mantenimiento (RF02)</h2>
    
    <form id="formSolicitud">
        <div class="form-group">
            <label for="equipo_id">Seleccionar Equipo / Activo *</label>
            <select id="equipo_id" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">Cargando equipos...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descripcion_problema">Descripción del Problema *</label>
            <textarea id="descripcion_problema" rows="4" placeholder="Describa detalladamente la falla o servicio requerido..." required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        </div>

        <div class="form-group">
            <label for="prioridad">Prioridad *</label>
            <select id="prioridad" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="BAJA">Baja</option>
                <option value="MEDIA" selected>Media</option>
                <option value="ALTA">Alta</option>
            </select>
        </div>

        <button type="submit">Registrar Solicitud (Pendiente)</button>
    </form>

    <div id="mensaje"></div>
</div>

<script src="js/solicitudes.js"></script>
</body>
</html>
