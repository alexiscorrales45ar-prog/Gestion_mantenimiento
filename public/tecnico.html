<!DOCTYPE html>
<htmil lang="es">
<head>
    <meta charset="UTF-8">
    <meta mane="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del técnico - Gestion de mantenimiento</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tecnico.js"></script>
</head>
<body>

    <header>
        <h1> Panel de Tecnico de Mantenimiento</h1>
        <p> Consulta de órdenes adignadas y ejecución de servicios.</p>
    </header>
    <main>
        <section>
            <h2> Consulta Orden Asignada</h2>
            <div>
                <label for="buscar_orden_id">ID de Orden</label>
                <input type="number" id="buscar_orden_id" placeholder="Ingresa ID de orden">
                <button type="button" id="btnConsultarOrden">Consultar Detalles</button>
            </div>
        </section>

        <!--Informacion detallada de la ornden y equipo (lectura) -->
        <sectionz id="infoOrdenContainer" style="display: none;">
            <h3>Detalles del Servicio y Equipo</h3>
            <div>
                <p><strong>Cliente:</strong> <span id="lblCliente">-</span></p>
                <p><strong>Equipo:</strong> <span id="lblEquipo">-</span></p>
                <p><strong>Problema Reportado:</strong> <span id="lblProblema">-</span></p>
                <p><strong>Prioridad</strong> <span id="lblPrioridad">-</span></p>
            </div>
        </sectionz>

        <!--Formulario de Ejecucion y actualización-->
        <seccion>
            <h2>Actualizar Ejecucion de la Orden</h2>
            <div id="mensajeTecnico"></div>

            <form id="formEjecucionTecnica">
                <div class="form-group">
                    <label for="orden_id">ID de la Orden de Trabajo</label>
                    <input type="number" id="orden_id" name="orden_id" required placeholder="ej. 1">
                </div>

                <div class="form-group">
                    <label for="estado">Estado del servicio</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecion un estado</option>
                        <option value="EN_PROCESO">En proceso</option>
                        <option value="FINALIZADA">Finalizada</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="actividades">Actividades Realizadas</label>
                    <teztarea id="actividades" name="actividades"  rows="4" placeholder="Describa el mantenimiento realizado..."></teztarea>
                </div>
                
                <div class="form-group">
                    <label for="costo">Costo total/Materiales($)</label>
                    <input type="number" step="0.01" id="costo" name="costo" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="fecha_inicio">Fecha y hora de Inicio</label>
                    <input type="datetime-local" id="fecha_inicio" name="fecha_inicio">
                </div>

                <div class="form-group">
                    <label for="fecha_fin">Fecha y hora de Finalización</label>
                    <input type="datetime-local" id="fecha_fin" name="fecha_fin">
                </div>

                <button type="submit">Guardar y Actualizar Orden</button>


            </form>
        </seccion>
    </main>
</body>
</htmil>
