<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale=1.0">
    <title>Registrar cliente y Equipo - Mantenimiento</title>
    <link rel="stylesheet" href="css/strilos.css">
    
</head>
<body>
<div class = "container">
    <h2> Caso de unso 1: Registrar cliente y equipo </h2>

    <form id = "formRegistroCliente">
        <h3>Dats del cliente</h3>
        <div class = "form-group">
            <label for="nombre_cliente"> Nombre completo / Empresa</label>
            <input type="text" id="nombre_cliente" required>
        </div>
        <div class="form-group">
            <label for="contacto_cliente">Nombre completo / Empresa *</label>
            <input type="text" id=" contecto_cliente" required>
        </div>
        <div class="form-group">
            <label for="direccion_cliente">Direccion</label>
            <input type="text" id="direccion_cliente">
        </div>
        <h3>Datos del Equipo / Actividad</h3>
        <div class="form-group">
            <label for="nombre_equipo">Nombre del Equipo *</label>
            <input type="text" id="nombre_equipo" placeholder="Ej: laptop Dell, compresor 50l" required>
        </div>
        <div class="form-group">
            <label for="marca">Marca</label>
            <input type="text" id="marca">
        </div>
        <div class="form-group">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo">
        </div>
        <div class="form-group">
            <label for="serie">Número de Serie</label>
            <input type="text" id="serie">
        </div>

        <button type="submit">Guardar Cliente y Equipo</button>
    </form>

    <div id="mensaje"></div>
</div>

<script src="js/clientes.js"></script>
</body>
</html>
