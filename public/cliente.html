<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Solicitudes - Mantenimiento</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/cliente.js"></script>
</head>
<body>
    <header>
        <h1>Módulo de Cliente y Equipo</h1>
        <p> Registro de nuevos clientes y administración de sus actividades asociadas</p>
    </header>

    <main>
        <!--Formulario para Registrar Cliente-->
        <section>
            <h2>Registrar Nuevo Cliente</h2>
            <!-- Corregido: div en lugar de dev -->
            <div id="mensajeCliente" style="display: none; padding: 10px; margin-bottom: 10px;"></div>

            <form id="formCliente">
                <div>
                    <label for="nombre">Nombre del cliente</label>
                    <!-- Corregido: id="nombre" -->
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Iswar Ramirez">
                </div>

                <div class="form-group">
                    <label for="contacto">Contacto (Teléfono/Email)</label>
                    <!-- Agregado: el campo de contacto que pedía el JS -->
                    <input type="text" id="contacto" name="contacto" required placeholder="Ej. 3109876543">
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <!-- Corregido: id="direccion" (estaba direccoin) -->
                    <input type="text" id="direccion" name="direccion" required placeholder="Ej. Carrera 15 # 45-20">  
                </div>
                
                <button type="submit">Guardar Cliente</button>
            </form>
        </section>

        <!--Formulario para registrar equipo asociado-->
        <section>
            <h2>Registrar Equipo o Activo</h2>
            <!-- Corregido: div en lugar de dvi -->
            <div id="mensajeEquipo" style="display: none; padding: 10px; margin-bottom: 10px;"></div>

            <!-- Corregido: Agregado id="formEquipo" -->
            <form id="formEquipo">
                <div class="form-group">
                    <label for="cliente_id">ID del Cliente Propietario:</label>
                    <input type="number" id="cliente_id" name="cliente_id" required placeholder="Ej. 1">      
                </div>
                <div class="form-group">
                    <label for="tipo">Tipo de Equipo:</label>
                    <input type="text" id="tipo" name="tipo" required placeholder="Ej. Servidor, Laptop, Impresora">
                </div>

                <div class="form-group">
                    <label for="marca">Marca y Modelo:</label>
                    <input type="text" id="marca" name="marca" required placeholder="Ej. Dell Latitude 3420">
                </div>

                <button type="submit">Registrar Equipo</button>
            </form>
        </section>

        <!-- Listado general de Clientes y Equipos (Se mantiene igual) -->
        <section>
            <h2>Clientes y Equipos Registrados</h2>
            <div>
                <button type="button" id="btnCargarClientes">Actualizar Listados</button>
            </div>
            
            <div style="margin-top: 15px;">
                <h3>Listado de Clientes</h3>
                <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Contacto</th>
                            <th>Dirección</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientesBody">
                        <tr>
                            <td colspan="4" style="text-align: center;">No hay clientes registrados</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

</body>
</html>
